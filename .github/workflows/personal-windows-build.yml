name: Personal Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 package
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs

    env:
      TARGET: x86_64-pc-windows-msvc
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ env.TARGET }}

      - name: Configure MSVC environment
        uses: ./.github/actions/setup-msvc-env
        with:
          target: ${{ env.TARGET }}

      - name: Build Codex and runtime helpers
        shell: bash
        run: |
          cargo build --release --target "$TARGET" \
            --bin codex \
            --bin codex-code-mode-host \
            --bin codex-command-runner \
            --bin codex-windows-sandbox-setup

      - name: Build canonical Codex package
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/build-codex-package-archive.sh" \
            --target "$TARGET" \
            --bundle primary \
            --entrypoint-dir "$CARGO_TARGET_DIR/$TARGET/release" \
            --archive-dir "dist/$TARGET"

      - name: Upload Codex package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-windows-x64-package
          path: codex-rs/dist/${{ env.TARGET }}/codex-package-${{ env.TARGET }}.tar.gz
          if-no-files-found: error
